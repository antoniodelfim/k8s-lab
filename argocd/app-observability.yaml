apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "65.5.1"
      helm:
        valueFiles:
          - $values/manifests/observability/values-kube-prometheus-stack.yaml
    - repoURL: https://github.com/antoniodelfim/k8s-lab.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  # Os CRDs do prometheus-operator ficam "OutOfSync" de forma cosmética no
  # ArgoCD (diff de metadata irrelevante em specs muito grandes). Problema
  # conhecido da comunidade — não afeta o estado real do cluster.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /metadata/annotations
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
