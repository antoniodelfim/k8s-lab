# App-of-apps: esta é a única Application aplicada manualmente (bootstrap).
# Ela mesma gerencia as demais Applications em argocd/, então qualquer novo
# app adicionado neste diretório passa a ser sincronizado automaticamente.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/antoniodelfim/k8s-lab.git
    targetRevision: master
    path: argocd
    directory:
      exclude: "root.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
